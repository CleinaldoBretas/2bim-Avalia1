<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Desenho Assinado</h1>
    <p>Escolha um número entre 1 e 100. Cada número gera uma figura diferente, assinada com o seu e-mail.</p>

    <div id="g_id_onload"
         data-client_id="626344497877-emffq75d70pt65rptm4kkkq9a4uuia5m.apps.googleusercontent.com"
         data-callback="onLogin"
         data-auto_prompt="false"></div>
    <div class="g_id_signin" data-type="standard"></div>

    <form>
      <label for="numero">Número</label>
      <input type="number" id="numero" min="1" max="100" value="42" required>
      <button type="submit">Desenhar</button>
    </form>

    <p id="erro" style="color:#ff6b6b"></p>
    <div id="resultado"></div>
  </main>

  <script src="script.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
